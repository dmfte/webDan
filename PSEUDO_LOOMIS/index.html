<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pseudo Loomis</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../assets/css/nav.css">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <!-- Navigation -->

  <div class="app">
    <div class="stage" id="stage">
      <canvas id="c" aria-label="Picture with wireframe globe"></canvas>
      <label class="mode-toggle" title="Switch between rotating and placing the globe">
        <input type="checkbox" id="placeMode" aria-label="Place mode: drag moves the globe instead of rotating it">
        <svg class="ico-rotate" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/>
          <path d="M17.5 3v4h-4"/>
        </svg>
        <svg class="ico-place" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 3v18M3 12h18"/>
          <path d="M9.5 5.5 12 3l2.5 2.5M9.5 18.5 12 21l2.5-2.5M5.5 9.5 3 12l2.5 2.5M18.5 9.5 21 12l-2.5 2.5"/>
        </svg>
      </label>
      <div class="empty" id="empty">
        <p>Choose a picture, or drop one here, then use the sliders to place and turn the globe.</p>
        <label class="btn primary picker">Choose picture<input type="file" class="file-in" accept="image/*"></label>
      </div>
    </div>
    <aside class="panel">
      <div id="intro">
        <h1>Globe on image</h1>
        <div class="file-row">
          <label class="btn picker">Choose picture<input type="file" class="file-in" accept="image/*"></label>
        </div>
      </div>
      <div class="file-row" id="dlRow" hidden>
        <button type="button" class="btn primary" id="save">Download picture</button>
      </div>

      <fieldset>
        <legend>Position and size</legend>
        <div class="row"><label for="gx">Across</label><input id="gx" type="range" min="0" max="100" step="0.1"><output></output></div>
        <div class="row"><label for="gy">Down</label><input id="gy" type="range" min="0" max="100" step="0.1"><output></output></div>
        <div class="row"><label for="size">Radius</label><input id="size" type="range" min="1" max="80" step="0.1"><output></output></div>
      </fieldset>

      <fieldset>
        <legend>Rotation</legend>
        <div class="row"><label for="ry">Spin</label><input id="ry" type="range" min="-180" max="180" step="1"><output></output></div>
        <div class="row"><label for="rx">Tilt</label><input id="rx" type="range" min="-180" max="180" step="1"><output></output></div>
        <div class="row"><label for="rz">Roll</label><input id="rz" type="range" min="-180" max="180" step="1"><output></output></div>
      </fieldset>

      <fieldset>
        <legend>Lines</legend>
        <div class="row"><label for="cut">Side cuts</label><input id="cut" type="range" min="0" max="60" step="1"><output></output></div>
        <div class="row"><label for="back">Back lines</label><input id="back" type="range" min="0" max="60" step="1"><output></output></div>
        <div class="row"><label for="width">Thickness</label><input id="width" type="range" min="0.1" max="3" step="0.05"><output></output></div>
        <label class="check"><input type="checkbox" id="outline"> Show sphere outline</label>
        <label class="check"><input type="checkbox" id="diam"> Show equatorial axes</label>
        <div class="colors">
          <label><input type="color" id="colMer"> Meridians</label>
          <label><input type="color" id="colEq"> Equator</label>
          <label><input type="color" id="colOut"> Outline</label>
        </div>
      </fieldset>

      <div class="actions">
        <button type="button" class="btn" id="reset">Reset rotation</button>
      </div>
      <div class="status" id="status" role="status"></div>
      <div class="status" aria-hidden="true">Version 19 (globe-relative)</div>
    </aside>
  </div>

  <script type="module" src="index.js"></script>
</body>

</html>
